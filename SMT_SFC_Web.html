<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SMT SFC 互動流程圖</title>
<style>
  :root{
    --bg:#f6f8fb; --panel:#fff; --line:#d9e2ef; --text:#1f2937; --muted:#64748b;
    --blue:#2563eb; --purple:#7c3aed; --orange:#f59e0b; --green:#10b981; --red:#e11d48;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}
  .app{display:flex;flex-direction:column;height:100vh}
  .toolbar{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    padding:12px 16px;background:#fff;border-bottom:1px solid #e5e7eb
  }
  .title{font-size:18px;font-weight:800;margin-right:6px}
  .btns{display:flex;flex-wrap:wrap;gap:8px}
  button{
    border:1px solid #cfd8e3;background:#fff;color:#334155;border-radius:10px;
    padding:8px 12px;cursor:pointer;font-size:14px
  }
  button:hover{background:#f8fafc}
  button.active{background:#eaf2ff;border-color:#9ec0ff;color:#0f4ec9;font-weight:700}
  .search{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  input{
    width:320px;max-width:48vw;border:1px solid #cfd8e3;border-radius:10px;
    padding:9px 12px;font-size:14px;outline:none
  }
  input:focus{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(147,197,253,.25)}
  .layout{
    display:grid;grid-template-columns:minmax(760px,1fr) 390px;gap:12px;
    padding:12px;height:calc(100vh - 68px)
  }
  .panel{background:var(--panel);border:1px solid #e5e7eb;border-radius:14px;overflow:hidden}
  .left{display:flex;flex-direction:column}
  .head{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:10px 14px;border-bottom:1px solid #eef2f7;background:#fbfcfe
  }
  .head .h1{font-size:14px;font-weight:700;color:#334155}
  .head .h2{font-size:12px;color:#64748b}
  .canvas{
    flex:1;overflow:auto;
    background:
      linear-gradient(#f8fafc 1px, transparent 1px),
      linear-gradient(90deg, #f8fafc 1px, transparent 1px);
    background-size:24px 24px;
  }
  #diagram{width:100%;min-width:980px;min-height:820px;display:block}
  .right{display:flex;flex-direction:column}
  .side-head{padding:14px 16px 10px;border-bottom:1px solid #eef2f7;background:#fbfcfe}
  .side-head h2{margin:0 0 4px 0;font-size:16px}
  .side-head p{margin:0;font-size:12px;color:#64748b;line-height:1.6}
  .side-body{padding:14px 16px 20px;overflow:auto}
  .node-name{font-size:22px;font-weight:800;margin:0 0 8px 0}
  .desc{font-size:13px;color:#475569;line-height:1.7;margin:0 0 12px 0}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .pill{display:inline-flex;align-items:center;padding:5px 10px;border-radius:999px;background:#f1f5f9;color:#334155;font-size:12px}
  .section{margin-top:14px;padding-top:14px;border-top:1px dashed #e5e7eb}
  .section h3{margin:0 0 10px 0;font-size:13px;color:#334155}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:12px}
  .chip.gray{background:#f1f5f9;color:#475569}
  .chip.warn{background:#fff7ed;color:#c2410c}
  .chip.red{background:#fff1f2;color:#be123c}
  .muted{color:#94a3b8;font-size:12px}
  .path{font-size:13px;line-height:1.8;color:#334155;background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:10px 12px}
  .help{font-size:12px;color:#64748b;line-height:1.7;background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:12px}
  @media (max-width: 1200px){
    .layout{grid-template-columns:1fr;height:auto}
    .right{min-height:420px}
    input{width:220px}
  }
</style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <div class="title">SMT SFC 互動流程圖</div>
    <div class="btns">
      <button class="view-btn active" data-view="process">流程視圖</button>
      <button class="view-btn" data-view="data">資料流視圖</button>
      <button class="view-btn" data-view="trace">追溯視圖</button>
      <button class="view-btn" data-view="audit">稽核視圖</button>
      <button id="btnTraceBox">外箱反查</button>
    </div>
    <div class="search">
      <input id="searchInput" type="text" placeholder="搜尋節點 / 系統 / 追溯鍵 / No.110 / Box..." />
      <button id="btnReset">重設</button>
      <button id="btnExport">匯出 SVG</button>
    </div>
  </div>

  <div class="layout">
    <div class="panel left">
      <div class="head">
        <div>
          <div class="h1" id="canvasTitle">流程視圖</div>
          <div class="h2" id="canvasSub">顯示 SMT 從來料到出貨的主流程</div>
        </div>
        <div class="h2">點節點看明細；資料流視圖只顯示所選節點相鄰連線標籤</div>
      </div>
      <div class="canvas">
        <svg id="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 820"></svg>
      </div>
    </div>

    <div class="panel right">
      <div class="side-head">
        <h2>節點資訊</h2>
        <p id="sideMeta">目前顯示所選節點的輸入、校驗、輸出、系統、追溯鍵與稽核關聯。</p>
      </div>
      <div class="side-body" id="detail"></div>
    </div>
  </div>
</div>

const svg = document.getElementById("diagram");
const detail = document.getElementById("detail");

const canvasTitle = document.getElementById("canvasTitle");
const canvasSub = document.getElementById("canvasSub");
const sideMeta = document.getElementById("sideMeta");

function byId(id){ return NODES.find(n => n.id === id); }

function esc(s){
  return String(s)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#39;");
}

function svgEl(tag, attrs={}, text=null){
  const e = document.createElementNS(SVG_NS, tag);
  for(const [k,v] of Object.entries(attrs)) e.setAttribute(k, v);
  if(text !== null) e.textContent = text;
  return e;
}

function clearSvg(){
  while(svg.firstChild) svg.removeChild(svg.firstChild);
}

function splitLabel(str, max=16){
  const s = String(str || "");
  if(s.length <= max) return [s];
  if(s.includes(" / ")){
    const p = s.split(" / ");
    if(p.length === 2) return p;
  }
  const mid = Math.ceil(s.length / 2);
  return [s.slice(0, mid), s.slice(mid)];
}

function center(n){
  return {x:n.x + n.w/2, y:n.y + n.h/2};
}

function edgeGeom(a,b){
  const ac = center(a), bc = center(b);

  if(a.y === b.y){
    if(a.x < b.x){
      return { d:`M ${a.x+a.w} ${ac.y} L ${b.x} ${bc.y}`, lx:(a.x+a.w+b.x)/2, ly:ac.y-8 };
    } else {
      return { d:`M ${a.x} ${ac.y} L ${b.x+b.w} ${bc.y}`, lx:(a.x+b.x+b.w)/2, ly:ac.y-8 };
    }
  }

  if(a.x === b.x){
    if(a.y < b.y){
      return { d:`M ${ac.x} ${a.y+a.h} L ${bc.x} ${b.y}`, lx:ac.x+42, ly:(a.y+a.h+b.y)/2 };
    } else {
      return { d:`M ${ac.x} ${a.y} L ${bc.x} ${b.y+b.h}`, lx:ac.x+42, ly:(a.y+b.y+b.h)/2 };
    }
  }

  const midY = (ac.y + bc.y)/2;
  return { d:`M ${ac.x} ${ac.y} L ${ac.x} ${midY} L ${bc.x} ${midY} L ${bc.x} ${bc.y}`, lx:(ac.x+bc.x)/2, ly:midY-8 };
}

function makeDefs(){
  const defs = svgEl("defs");
  const marker = svgEl("marker", {
    id:"arrow", viewBox:"0 0 10 10", refX:"8.5", refY:"5", markerWidth:"7", markerHeight:"7", orient:"auto-start-reverse"
  });
  marker.appendChild(svgEl("path", {d:"M 0 0 L 10 5 L 0 10 z", fill:"#94a3b8"}));
  defs.appendChild(marker);

  const style = svgEl("style");
  style.textContent = `
    .edge{fill:none;stroke:#94a3b8;stroke-width:2.4;marker-end:url(#arrow)}
    .edge.dim{opacity:.13}
    .edge.focus{stroke:#2563eb;stroke-width:3.2}
    .edge.audit{stroke:#e11d48;stroke-width:3.2}
    .edge-label{font-family:Microsoft JhengHei,Noto Sans TC,sans-serif;font-size:10px;fill:#475569;text-anchor:middle}
    .node{cursor:pointer}
    .node.dim{opacity:.22}
    .node.selected rect{stroke-width:3.2}
    .node-title{font-family:Microsoft JhengHei,Noto Sans TC,sans-serif;font-size:18px;font-weight:800;fill:#1f2937;text-anchor:middle}
    .node-sub{font-family:Microsoft JhengHei,Noto Sans TC,sans-serif;font-size:10px;fill:#526072;text-anchor:middle}
    .badge{font-family:Microsoft JhengHei,Noto Sans TC,sans-serif;font-size:10px;font-weight:700;fill:#fff;text-anchor:middle}
    .legend{font-family:Microsoft JhengHei,Noto Sans TC,sans-serif;font-size:11px;fill:#64748b}
  `;
  defs.appendChild(style);
  svg.appendChild(defs);
}

function matches(node, keyword){
  if(!keyword) return true;
  const hay = [
    node.name, node.type, node.label, node.desc,
    ...(node.inputs||[]), ...(node.validations||[]), ...(node.outputs||[]),
    ...(node.systems||[]), ...(node.traceKeys||[]),
    ...(node.auditRefs||[]), ...(node.auditRefs||[]).map(x => "No."+x)
  ].join(" ").toLowerCase();
  return hay.includes(keyword.toLowerCase());
}

function traceEdgeSet(){
  const s = new Set();
  for(let i=0;i<TRACE_CHAIN.length-1;i++){
    s.add(`${TRACE_CHAIN[i]}->${TRACE_CHAIN[i+1]}`);
    s.add(`${TRACE_CHAIN[i+1]}->${TRACE_CHAIN[i]}`);
  }
  return s;
}

function drawMultiText(parent, x, y, lines, cls, gap=13){
  const text = svgEl("text", {x, y, class:cls});
  lines.forEach((line, i) => {
    text.appendChild(svgEl("tspan", {x, dy:i===0?0:gap}, line));
  });
  parent.appendChild(text);
  return text;
}

function drawEdgeLabel(x, y, textStr){
  const g = svgEl("g");
  svg.appendChild(g);

  const text = svgEl("text", {x, y, class:"edge-label"});
  splitLabel(textStr, 16).forEach((line, i) => {
    text.appendChild(svgEl("tspan", {x, dy:i===0?0:12}, line));
  });
  g.appendChild(text);

  const bb = text.getBBox();
  const bg = svgEl("rect", {
    x:bb.x - 6, y:bb.y - 3, width:bb.width + 12, height:bb.height + 6,
    rx:8, ry:8, fill:"#fff", stroke:"#dbeafe"
  });
  g.insertBefore(bg, text);
}

function drawLegend(){
  const items = [
    {label:"物料", color:GROUP_STYLE.material.stroke},
    {label:"製程", color:GROUP_STYLE.process.stroke},
    {label:"檢查/品質", color:GROUP_STYLE.check.stroke},
    {label:"包裝/出貨", color:GROUP_STYLE.pack.stroke}
  ];
  const g = svgEl("g");
  let x = 40, y = 785;
  items.forEach(it => {
    g.appendChild(svgEl("circle", {cx:x, cy:y, r:6, fill:it.color}));
    g.appendChild(svgEl("text", {x:x+12, y:y+4, class:"legend"}, it.label));
    x += 95;
  });
  svg.appendChild(g);
}

function draw(){
  clearSvg();
  makeDefs();

  const vm = VIEW_META[state.view];
  canvasTitle.textContent = vm.title;
  canvasSub.textContent = vm.sub;
  sideMeta.textContent =
    state.view === "process" ? "目前顯示所選節點的輸入、校驗、輸出、系統、追溯鍵與稽核關聯。"
    : state.view === "data" ? "資料流視圖只顯示目前所選節點的相鄰連線標籤，避免文字全部擠在一起。"
    : state.view === "trace" ? "追溯視圖會高亮外箱反查鏈；你也可以先點其他節點再看其上下游。"
    : "稽核視圖會高亮與 No.61 / 112 / 110 / 109 / 53 / 39 直接相關的節點。";

  const traceSet = traceEdgeSet();

  EDGES.forEach(edge => {
    const a = byId(edge.from), b = byId(edge.to);
    const g = edgeGeom(a,b);

    let cls = "edge";
    let dim = false;

    if(state.view === "trace"){
      if(traceSet.has(`${edge.from}->${edge.to}`)) cls += " focus";
      else dim = true;
    }

    if(state.view === "audit"){
      const hit = (a.auditRefs && a.auditRefs.length) || (b.auditRefs && b.auditRefs.length);
      if(hit) cls += " audit";
      else dim = true;
    }

    if(state.keyword){
      const hit = matches(a, state.keyword) || matches(b, state.keyword) || edge.label.toLowerCase().includes(state.keyword.toLowerCase());
      if(!hit) dim = true;
    }

    if(dim) cls += " dim";
    svg.appendChild(svgEl("path", {d:g.d, class:cls}));

    if(state.view === "data"){
      const related = state.selected && (edge.from === state.selected || edge.to === state.selected);
      if(related && !dim){
        drawEdgeLabel(g.lx, g.ly, edge.label);
      }
    }
  });

  NODES.forEach(node => {
    const gs = GROUP_STYLE[node.group];
    let fill = gs.fill, stroke = gs.stroke, dim = false;

    if(state.view === "trace" && !TRACE_CHAIN.includes(node.id)) dim = true;

    if(state.view === "audit"){
      if(node.auditRefs && node.auditRefs.length){
        fill = "#FFF1F2";
        stroke = "#E11D48";
      } else {
        dim = true;
      }
    }

    if(state.keyword && !matches(node, state.keyword)) dim = true;

    const g = svgEl("g", {class: node.id === state.selected ? (dim ? "node dim selected" : "node selected") : (dim ? "node dim" : "node")});
    const rect = svgEl("rect", {
      x:node.x, y:node.y, width:node.w, height:node.h, rx:12, ry:12, fill, stroke
    });
    g.appendChild(rect);

    g.appendChild(svgEl("text", {
      x:node.x + node.w/2, y:node.y + 30, class:"node-title"
    }, node.name));

    let sub = node.type;
    if(state.view === "data") sub = node.label;
    if(state.view === "trace" && TRACE_CHAIN.includes(node.id)) sub = `追溯鍵：${node.traceKeys[0] || "-"}`;
    if(state.view === "audit" && node.auditRefs.length) sub = `稽核：${node.auditRefs.map(x => "No."+x).join(" / ")}`;

    const lines = splitLabel(sub, 16);
    drawMultiText(
      g,
      node.x + node.w/2,
      node.y + (lines.length > 1 ? 44 : 52),
      lines,
      "node-sub",
      13
    );

    if(node.auditRefs.length){
      g.appendChild(svgEl("rect", {
        x:node.x + node.w - 34, y:node.y - 8, width:28, height:18, rx:9, ry:9, fill:"#E11D48"
      }));
      g.appendChild(svgEl("text", {
        x:node.x + node.w - 20, y:node.y + 5, class:"badge"
      }, String(node.auditRefs.length)));
    }

    g.addEventListener("click", () => {
      state.selected = node.id;
      renderDetail(node);
      draw();
    });

    svg.appendChild(g);
  });

  drawLegend();
}

function chips(arr, cls=""){
  if(!arr || !arr.length) return `<div class="muted">無</div>`;
  return `<div class="chips">${arr.map(v => `<span class="chip ${cls}">${esc(v)}</span>`).join("")}</div>`;
}

function upstream(id){
  return EDGES.filter(e => e.to === id).map(e => byId(e.from)?.name).filter(Boolean);
}
function downstream(id){
  return EDGES.filter(e => e.from === id).map(e => byId(e.to)?.name).filter(Boolean);
}

function traceText(id){
  if(id === "box") return "Box ID → Product SN / Board SN → Panel ID → 工單 / 線別 / 機台 → Feeder SN → Reel Lot → Supplier Lot";
  if(id === "feeder") return "Feeder SN → Reel Lot → 工單 / 站位 → Panel ID / SN → AOI / 測試 → OQC → 外箱";
  if(id === "depanel") return "Panel ID ↔ Board SN ↔ Position No. → 測試 → OQC → 外箱";
  if(id === "spi") return "Panel ID → SPI Result / Defect Code → 貼片 / AOI / 後續品質判定";
  if(id === "aoi") return "Panel ID / Board SN → AOI Result / Defect Code → 維修 / 複判 → 測試 / OQC";
  return "可依此節點的追溯鍵向前反查原物料，向後追蹤包裝與出貨。";
}

function renderDetail(node){
  if(!node){
    detail.innerHTML = `<div class="help">請點選左側節點。</div>`;
    return;
  }
  const up = upstream(node.id);
  const down = downstream(node.id);

  detail.innerHTML = `
    <div class="node-name">${esc(node.name)}</div>
    <div class="desc">${esc(node.desc)}</div>

    <div class="row">
      <span class="pill">站點型態：${esc(node.type)}</span>
      <span class="pill">系統：${esc(node.systems.join(" / "))}</span>
      <span class="pill">群組：${esc(node.group)}</span>
    </div>

    <div class="section">
      <h3>輸入資料</h3>
      ${chips(node.inputs)}
    </div>

    <div class="section">
      <h3>系統校驗</h3>
      ${chips(node.validations, "warn")}
    </div>

    <div class="section">
      <h3>輸出資料</h3>
      ${chips(node.outputs)}
    </div>

    <div class="section">
      <h3>追溯鍵</h3>
      ${chips(node.traceKeys, "gray")}
    </div>

    <div class="section">
      <h3>上下游節點</h3>
      <div style="margin-bottom:10px;"><b>上游：</b>${up.length ? up.map(esc).join(" → ") : "無"}</div>
      <div><b>下游：</b>${down.length ? down.map(esc).join(" → ") : "無"}</div>
    </div>

    <div class="section">
      <h3>異常閉環</h3>
      ${chips(node.exceptions, "red")}
    </div>

    <div class="section">
      <h3>稽核關聯</h3>
      ${
        node.auditRefs.length
          ? `<div class="chips">${node.auditRefs.map(v => `<span class="chip red">No.${esc(v)}</span>`).join("")}</div>`
          : `<div class="muted">無直接關聯</div>`
      }
    </div>

    <div class="section">
      <h3>追溯展示語句</h3>
      <div class="path">${esc(traceText(node.id))}</div>
    </div>

    <div class="section">
      <h3>使用方式</h3>
      <div class="help">
        1. 流程視圖：看主流程。<br>
        2. 資料流視圖：只顯示你目前點到節點的相鄰連線標籤。<br>
        3. 追溯視圖：看外箱反查鏈。<br>
        4. 稽核視圖：對照 No.61 / 112 / 110 / 109 / 53 / 39。<br>
        5. 搜尋框可輸入：Box、AOI、Feeder、No.110、Panel ID 等。
      </div>
    </div>
  `;
}

function setView(view){
  state.view = view;
  document.querySelectorAll(".view-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.view === view);
  });
  draw();
  renderDetail(byId(state.selected));
}

function resetAll(){
  state.view = "process";
  state.selected = "box";
  state.keyword = "";
  input.value = "";
  document.querySelectorAll(".view-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.view === "process");
  });
  draw();
  renderDetail(byId("box"));
}

function exportSvg(){
  const clone = svg.cloneNode(true);
  clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
  clone.setAttribute("version","1.1");

  const source = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone);
  const blob = new Blob([source], {type:"image/svg+xml;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `smt_sfc_${state.view}.svg`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 500);
}

document.querySelectorAll(".view-btn").forEach(btn => {
  btn.addEventListener("click", () => setView(btn.dataset.view));
});

document.getElementById("btnTraceBox").addEventListener("click", () => {
  state.selected = "box";
  setView("trace");
  renderDetail(byId("box"));
});

document.getElementById("btnReset").addEventListener("click", resetAll);
document.getElementById("btnExport").addEventListener("click", exportSvg);

input.addEventListener("input", e => {
  state.keyword = e.target.value.trim();
  draw();
  renderDetail(byId(state.selected));
});

renderDetail(byId(state.selected));
draw();
</script>
</body>
</html>
